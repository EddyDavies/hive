id = "move-tab"
name = "Move Tab"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Move the current tab, and the chats running in it, to another workspace or a new one, picked from a popup."
platforms = ["linux", "macos"]

[[actions]]
id = "pick"
title = "Move tab to workspace..."
description = "Opens a popup listing your workspaces; pick one, or type a name for a new one, and the tab moves there with its label."
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "-m", "herdr_move_tab.cli", "open-picker"]

[[panes]]
id = "picker"
title = "Move tab to workspace"
placement = "popup"
width = "70%"
height = 18
command = ["python3", "-m", "herdr_move_tab.cli", "pick"]
