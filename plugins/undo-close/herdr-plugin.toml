id = "undo-close"
name = "Undo Close"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Reopen a closed tab or pane, Chrome-style: label, split layout, cwds, position, and the editor or agent that was running in it."
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "tab.created"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "tab.closed"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "tab.renamed"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "tab.moved"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "pane.created"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "pane.closed"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "pane.exited"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "pane.moved"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "workspace.closed"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

# An agent pane's session id arrives after the pane exists (the claude hook
# reports it on the first prompt), so refresh when an agent changes state too.
[[events]]
on = "pane.agent_detected"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "-m", "herdr_undo_close.cli", "record"]

[[actions]]
id = "reopen-last"
title = "Reopen closed tab or pane"
description = "Restores whatever closed last, tab or pane: same layout, cwds, position, and the editor or agent it was running."
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "-m", "herdr_undo_close.cli", "reopen"]

[[actions]]
id = "pick"
title = "Reopen closed tab or pane from list..."
description = "Opens a popup listing recently closed tabs and panes so you can pick one to restore."
contexts = ["global", "workspace", "tab", "pane"]
command = ["python3", "-m", "herdr_undo_close.cli", "open-picker"]

[[panes]]
id = "picker"
title = "Reopen closed tab or pane"
placement = "popup"
width = "80%"
height = 14
command = ["python3", "-m", "herdr_undo_close.cli", "pick"]
